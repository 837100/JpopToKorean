<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J-Pop to Korean</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="sidebar/sidebar.css?v=20260905-layout4">
    <style>
        .youtube-fallback-link {
            display: block;
            margin: 0.5rem auto 0;
            text-align: center;
        }

        .song-home-link {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 3000;
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.65);
            border-radius: 999px;
            padding: 0.5rem 1rem;
            font-weight: 700;
            text-decoration: none;
            background: rgba(0, 0, 0, 0.2);
        }

        .song-home-link:hover,
        .song-home-link:focus {
            color: #fff;
            text-decoration: none;
            background: rgba(0, 0, 0, 0.45);
        }
    </style>
</head>

<body class="container mt-5">
    <button class="menu-btn" id="menu-button" type="button">☰ 메뉴</button>
    <div id="sidebar-container"></div>
    <a class="song-home-link" href="index.html">홈</a>
    <header id="header">
        <div class="text-center mt-4">
            <div id="player"></div>
        </div>
    </header>
    <main id="main">
        <h1 id="song-title" class="text-center">노래 정보를 불러오는 중...</h1>
        <div id="song-lyrics-container" class="mt-5">
            <pre id="song-lyrics" class="text-center mt-3" style="font-size: large;"></pre>
        </div>
    </main>
    <div class="text-center mb-4">
        <a id="artist-page-link" class="btn btn-outline-primary" href="">가수 페이지로 돌아가기</a>
    </div>
    <div style="position: fixed; bottom:5px; right:5px">
        <a id="next-song" href=""><img src="img/right-arrow.png" title="다음곡" style="width: 50px; height: 50px;" alt="다음곡"> </a>
    </div>
    <div style="position: fixed; bottom:5px; right:60px">
        <a id="prev-song" href=""><img src="img/left-arrow.png" title="이전곡" style="width: 50px; height: 50px;" alt="이전곡"></a>
    </div>

    <script src="songData.js"></script>
    <script src="songPage.js?v=20260905-song-page"></script>
    <script src="nextPage.js?v=20260905-layout2"></script>
</body>

</html>
