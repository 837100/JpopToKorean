<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artist</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="mainPage/style.css">
    <link rel="stylesheet" href="sidebar/sidebar.css">
    <style>
        body {
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            position: relative;
            min-height: 100vh;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background-size: cover;
            background-position: center;
            filter: blur(80px);
            z-index: -1;
        }

        .card {
            width: 300px;
            height: 300px;
            background-position: center;
            background-size: cover;
            margin: 3rem auto 20px;
            border-radius: 50%;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
        }

        .list-group {
            max-width: 640px;
            margin: 0 auto 3rem;
        }

        .list-group-item {
            background: rgba(255, 255, 255, 0.9);
        }
    </style>
    <style id="artist-style"></style>
</head>

<body>
    <button class="menu-btn" id="menu-button" type="button">☰ 메뉴</button>
    <div id="sidebar-container"></div>

    <article class="start text-center">
        <h1 class="mt-3" id="artist-name"></h1>
        <div class="container text-center">
            <div class="overlay"></div>
            <div class="card rounded-circle mt-5" id="artist-card"></div>
        </div>

        <nav class="mt-4" aria-label="페이지 이동">
            <a class="btn btn-primary" href="index.html">Home</a>
            <a class="btn btn-primary" id="artist-home-link" href=""></a>
        </nav>

        <section class="container mt-5" aria-labelledby="song-list-title">
            <h2 id="song-list-title">노래 목록</h2>
            <div class="list-group" id="song-list"></div>
        </section>
    </article>

    <script src="songData.js"></script>
    <script src="artistPage.js"></script>
</body>

</html>
