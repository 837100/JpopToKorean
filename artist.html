<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artist</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="mainPage/style.css">
    <link rel="stylesheet" href="sidebar/sidebar.css">
    <style>
        body {
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            position: relative;
            min-height: 100vh;
            padding-bottom: 3rem;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background-size: cover;
            background-position: center;
            filter: blur(80px);
            z-index: -1;
        }

        .card {
            width: 300px;
            height: 300px;
            background-position: center;
            background-size: cover;
            margin: 3rem auto 20px;
            border-radius: 50%;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
        }

        .artist-topbar {
            position: sticky;
            top: 0;
            z-index: 900;
            display: flex;
            justify-content: flex-end;
            padding: 1rem 1.25rem;
            background: rgba(15, 15, 20, 0.62);
            backdrop-filter: blur(12px);
        }

        .home-link {
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.65);
            border-radius: 999px;
            padding: 0.5rem 1rem;
            font-weight: 700;
            text-decoration: none;
            transition: background-color 0.2s ease, border-color 0.2s ease;
        }

        .home-link:hover,
        .home-link:focus {
            color: #fff;
            background: var(--artist-accent);
            border-color: var(--artist-accent);
            text-decoration: none;
        }

        .artist-hero {
            padding-top: 1rem;
        }

        .artist-name {
            font-weight: 800;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.45);
        }

        .list-group {
            max-width: 640px;
            margin: 0 auto 3rem;
        }

        .list-group-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.92);
            border: 0;
            margin-bottom: 0.55rem;
            border-radius: 0.5rem;
            color: #202027;
            font-weight: 700;
            transition: transform 0.2s ease, background-color 0.2s ease;
        }

        .list-group-item::after {
            content: "→";
            color: var(--artist-accent);
            font-size: 1.2rem;
        }

        .list-group-item:hover,
        .list-group-item:focus {
            color: #202027;
            background: #fff;
            transform: translateX(4px);
            text-decoration: none;
        }

        @media (max-width: 576px) {
            .artist-topbar {
                padding: 0.75rem 1rem;
            }

            .card {
                width: min(70vw, 300px);
                height: min(70vw, 300px);
            }
        }
    </style>
    <style id="artist-style"></style>
</head>

<body>
    <button class="menu-btn" id="menu-button" type="button">☰ 메뉴</button>
    <div id="sidebar-container"></div>
    <header class="artist-topbar">
        <a class="home-link" href="index.html">← 홈으로</a>
    </header>

    <article class="start text-center artist-hero">
        <h1 class="mt-3 artist-name" id="artist-name">가수 정보를 불러오는 중...</h1>
        <div class="container text-center">
            <div class="overlay"></div>
            <div class="card rounded-circle mt-5" id="artist-card"></div>
        </div>

        <nav class="mt-4" aria-label="페이지 이동">
        </nav>

        <section class="container mt-5" aria-labelledby="song-list-title">
            <h2 id="song-list-title">노래 목록</h2>
            <p class="mb-3 text-white-50" id="song-count" aria-live="polite"></p>
            <div class="list-group" id="song-list" aria-live="polite"></div>
        </section>
    </article>

    <script src="songData.js"></script>
    <script src="artistPage.js"></script>
</body>

</html>
