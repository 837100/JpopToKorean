<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J-Pop to Korean | 가사 번역 라이브러리</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="mainPage/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;800&display=swap" rel="stylesheet">
</head>
<body>

    <section class="hero-section">
        <div class="container">
            <h1 class="hero-title">J-Pop to Korean</h1>
            <p class="hero-subtitle">
                좋아하는 일본 노래의 가사를 한국어로 만나보세요.<br>
                원문 가사, 읽는 법, 그리고 정성스러운 번역까지 한곳에 담았습니다.
            </p>
        </div>
    </section>

    <div class="artist-container">
        <h2 class="section-title">Artists</h2>

        <div class="artist-grid">
            <!-- Aimyon -->
            <a href="artist.html?artist=aimyon" class="artist-card">
                <img src="img/aimyon.jpg" alt="Aimyon" class="artist-image">
                <div class="artist-overlay">
                    <div class="artist-name">あいみょん (Aimyon)</div>
                    <div class="artist-view-btn">노래 보기 →</div>
                </div>
            </a>

            <!-- Mrs. GREEN APPLE -->
            <a href="artist.html?artist=mrsgreenapple" class="artist-card">
                <img src="img/mrs.jpg" alt="Mrs. GREEN APPLE" class="artist-image">
                <div class="artist-overlay">
                    <div class="artist-name">Mrs. GREEN APPLE</div>
                    <div class="artist-view-btn">노래 보기 →</div>
                </div>
            </a>

            <!-- Placeholder 1 -->
            <div class="artist-card" style="opacity: 0.6; cursor: default;">
                <div class="artist-image" style="background: #333; height: 100%; width: 100%;"></div>
                <div class="artist-overlay">
                    <div class="artist-name">Coming Soon</div>
                    <div class="artist-view-btn" style="opacity: 0; pointer-events: none;">-</div>
                </div>
            </div>

            <!-- Placeholder 2 -->
            <div class="artist-card" style="opacity: 0.6; cursor: default;">
                <div class="artist-image" style="background: #333; height: 100%; width: 100%;"></div>
                <div class="artist-overlay">
                    <div class="artist-name">Coming Soon</div>
                    <div class="artist-view-btn" style="opacity: 0; pointer-events: none;">-</div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
